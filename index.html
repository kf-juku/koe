var SHOW=FIX?[FIX]:D['入口'].filter(function(x){return x['はじめに出す']});
function brand(e){return D['ブランド'][e?e['ブランド']:D['はじめのブランド']]}
document.title=brand(FIX)['名前']+'｜あなたの話を聞かせてください';
var P={left:'<path d="M15 6l-6 6l6 6"/>',right:'<path d="M5 12h14M13 18l6-6M13 6l6 6"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9a9 9 0 1 1 -9 -9z"/>',chat:'<path d="M3 20l1.3-3.9a9 8 0 1 1 3.4 2.9z"/>',school:'<path d="M22 9l-10-4l-10 4l10 4l10-4v6"/><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M5 9a2 2 0 0 1 0-4h2M19 9a2 2 0 0 0 0-4h-2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2l4-4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',send:'<path d="M10 14L21 3M21 3l-6.5 18a.55.55 0 0 1-1 0L10 14l-7-3.5a.55.55 0 0 1 0-1z"/>',ext:'<path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M11 13l9-9M15 4h5v5"/>'};
function I(n){return '<svg class=i viewBox="0 0 24 24">'+P[n]+'</svg>'}
back.innerHTML=I('left');thm.innerHTML=I('moon');
function theme(){var d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark'}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(function(){toastEl.classList.remove('show')},1600)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var WIDE=['分からない','特にない','入っていない'];
var ent=null,i=0,A={};
// 下書き：途中で閉じても続きから（この端末だけ）
function saveDraft(){try{if(ent)localStorage.setItem('koe_draft',JSON.stringify({k:ent['キー'],i:i,A:A,t:Date.now()}))}catch(e){}}
function loadDraft(){try{var d=JSON.parse(localStorage.getItem('koe_draft')||'null');if(d&&Date.now()-d.t<3*86400000)return d}catch(e){}return null}
function clearDraft(){try{localStorage.removeItem('koe_draft')}catch(e){}}
function sid(){return 'K_'+Date.now()+'_'+Math.random().toString(36).slice(2,10)}

function home(){ent=null;i=0;ttl.textContent=brand(FIX)['名前'];back.classList.add('hide');prog.classList.add('hide');nav.classList.add('hide');
 var h='<div class=card><div class=lab>VOICE</div><h2>あなたの話を聞かせてください</h2><p class=hint>選ぶだけの質問が中心です。だいたい'+esc((FIX||SHOW[0])['目安'])+'で終わります。</p><div class=safe>'+I('lock')+'<div>'+esc(D['最初の案内'])+'</div></div>'+(MODE==='代理入力'?'<p class=note>代理入力のモードです</p>':'')+'</div>';
 var dr=loadDraft();
 if(dr){var e=SHOW.filter(function(x){return x['キー']===dr.k})[0];if(e)h+='<div class=card><p class=hint>途中まで答えたものがあります。</p><button class="btn" onclick="resume()">続きから答える</button><button class="btn sub" onclick="clearDraft();home()">はじめから答える</button></div>'}
 SHOW.forEach(function(e){h+='<div class="card ent" data-k="'+esc(e['キー'])+'" onclick="start(this.dataset.k)"><div class=ic>'+I(e['アイコン']||'chat')+'</div><div><b>'+esc(e['ボタン'])+'</b><small>'+esc(e['ボタンの説明'])+'</small></div></div>'});
 main.innerHTML=h}
function resume(){var d=loadDraft();ent=D['入口'].filter(function(x){return x['キー']===d.k})[0];A=d.A||{};i=d.i||0;ttl.textContent=ent['名前'];render()}
function start(k){ent=D['入口'].filter(function(x){return x['キー']===k})[0];i=0;A={};A['__送信ID']=sid();ttl.textContent=ent['名前'];render()}

function grid(q){var o=q['選択肢'],n=o.filter(function(x){return WIDE.indexOf(x)<0}).length,v=A[q.id],multi=q['種類']==='いくつでも';
 return '<div class="g'+(n%2?' c1':'')+'">'+o.map(function(x){var on=multi?(v||[]).indexOf(x)>=0:v===x;return '<button class="o'+(WIDE.indexOf(x)>=0?' w':'')+(on?' on':'')+'" data-q="'+esc(q.id)+'" data-v="'+esc(x)+'" onclick="pick(this,'+multi+')">'+esc(x)+'</button>'}).join('')+'</div>'}
function pick(b,multi){var id=b.dataset.q,v=b.dataset.v;
 if(multi){var a=A[id]||[];var k=a.indexOf(v);if(k>=0)a.splice(k,1);else a.push(v);A[id]=a;b.classList.toggle('on')}
 else{if(A[id]===v){delete A[id];b.classList.remove('on')}else{A[id]=v;[].forEach.call(b.parentNode.children,function(c){c.classList.remove('on')});b.classList.add('on')}}
 saveDraft();follows()}
function schoolSel(q){var v=A[q.id]||'',list=D['高校']['公立'].concat(D['高校']['私立']).map(function(x){return x+'高校'}),other=v&&list.indexOf(v)<0;
 function og(lab,arr){return '<optgroup label="'+lab+'">'+arr.map(function(x){x+='高校';return '<option'+(v===x?' selected':'')+'>'+x+'</option>'}).join('')+'</optgroup>'}
 return '<select data-q="'+esc(q.id)+'" onchange="schoolPick(this)"><option value="">選んでください</option>'+og('公立',D['高校']['公立'])+og('私立',D['高校']['私立'])+'<option value="__他"'+(other?' selected':'')+'>そのほか（書いて入力）</option></select><input class="'+(other?'':'hide')+'" data-q="'+esc(q.id)+'" data-o=1 placeholder="高校の名前" value="'+(other?esc(v):'')+'" style="margin-top:8px" oninput="A[this.dataset.q]=this.value;saveDraft()">'}
function schoolPick(s){var inp=s.nextElementSibling;if(s.value==='__他'){inp.classList.remove('hide');A[s.dataset.q]=inp.value}else{inp.classList.add('hide');A[s.dataset.q]=s.value}saveDraft()}
function deep(q){var id=q.id;return '<textarea data-q="'+esc(id)+'" oninput="A[this.dataset.q]=this.value;saveDraft();clearTimeout(this.t);this.t=setTimeout(follows,600)">'+esc(A[id]||'')+'</textarea>'+
 '<div class=hide data-f="'+esc(id)+'"><div class=ai><div class=ic>'+I('chat')+'</div><div class=bub></div></div><textarea data-q2="'+esc(id)+'" placeholder="ひとことでOK" oninput="setFollow(this)">'+esc(A[id+'（追加の答え）']||'')+'</textarea></div>'}
// 深掘り：選んだものと書いた言葉から、用意した質問を1つ出す（APIは使わない）
function setFollow(t){A[t.dataset.q2+'（追加の答え）']=t.value;saveDraft()}
function follows(){if(!ent)return;var pg=ent['ページ'][i];if(!pg)return;pg['問'].forEach(function(q){if(q['種類']!=='深掘り')return;var box=document.querySelector('[data-f="'+q.id+'"]');if(!box)return;
 var sel=q['深掘りに使う選択']?[].concat(A[q['深掘りに使う選択']]||[]).join(' '):'';var text=A[q.id]||'';var src=sel+' '+text,qq='';
 (D['深掘り'][q['深掘りキー']]||[]).some(function(r){if(new RegExp(r[0]).test(src)&&(r[0]!=='.'||text.trim())){qq=r[1];return true}});
 if(!qq&&text.trim())qq=D['既定の深掘り'];
 if(A[q.id+'（追加の質問）']&&A[q.id+'（追加の質問）']!==qq&&A[q.id+'（追加の答え）'])qq=A[q.id+'（追加の質問）']; // 答えた後は質問を変えない
 if(qq){A[q.id+'（追加の質問）']=qq}else{delete A[q.id+'（追加の質問）']}
 box.classList.toggle('hide',!qq);box.querySelector('.bub').textContent=qq})}

function render(){back.classList.remove('hide');if(i>=ent['ページ'].length)return confirmSend();prog.classList.remove('hide');nav.classList.remove('hide');
 var pgs=ent['ページ'],pg=pgs[i];barin.style.width=(i/pgs.length*100)+'%';cnt.textContent=(i+1)+' / '+pgs.length;
 var deepPage=pg['問'].some(function(q){return q['種類']==='深掘り'});
 var h='<div class=card><div class=lab>'+(deepPage?'あなたの言葉で':'選んでください')+'</div><h2>'+esc(pg['題'])+'</h2>'+(pg['案内']?'<p class=hint>'+esc(pg['案内'])+'</p>':'');
 pg['問'].forEach(function(q){var t=q['種類'];if(q['見出し'])h+='<div class=q>'+esc(q['見出し'])+'</div>';
  if(t==='名前')h+='<input data-q="名前" placeholder="フルネーム" value="'+esc(A['名前']||'')+'" oninput="A.名前=this.value;saveDraft()">';
  else if(t==='高校')h+=schoolSel(q);
  else if(t==='一つ'||t==='いくつでも')h+=grid(q);
  else if(t==='短い')h+='<input data-q="'+esc(q.id)+'" placeholder="'+esc(q['例']||'')+'" value="'+esc(A[q.id]||'')+'" oninput="A[this.dataset.q]=this.value;saveDraft()">';
  else if(t==='ひとこと')h+='<textarea data-q="'+esc(q.id)+'" placeholder="'+esc(q['例']||'')+'" style="min-height:60px" oninput="A[this.dataset.q]=this.value;saveDraft()">'+esc(A[q.id]||'')+'</textarea>';
  else if(t==='深掘り')h+=deep(q)});
 h+='<div class=err id=err></div></div>';main.innerHTML=h;follows();
 nx.disabled=false;nx.innerHTML=(i===pgs.length-1?'確認へ ':'次へ ')+I('right');scrollTo(0,0);saveDraft()}
function go(d){if(!ent)return;
 if(d>0&&i<ent['ページ'].length){var miss=[];ent['ページ'][i]['問'].forEach(function(q){if((q['種類']==='名前'||q['種類']==='高校')&&!String(A[q.id]||'').trim())miss.push(q['見出し'])});
  if(miss.length){err.textContent=miss.join('・')+'を入れてください';return}}
 if(d<0&&i>=ent['ページ'].length){i=ent['ページ'].length-1;return render()}
 i+=d;if(i<0){saveDraft();return home()}render()}
function confirmSend(){prog.classList.add('hide');nav.classList.add('hide');
 main.innerHTML='<div class=card><h2>これで送りますか？</h2><p class=hint>'+esc(A['名前']||'')+' さん／'+esc(A['高校']||'')+'</p><button class=btn id=sendBtn onclick="send()">送る '+I('send')+'</button><button class="btn sub" onclick="go(-1)">もどって直す</button><div class=err id=err></div></div>'}
function send(){var btn=document.getElementById('sendBtn');if(btn.disabled)return;btn.disabled=true;btn.textContent='送っています…';
 var ans={};Object.keys(A).forEach(function(k){if(k.indexOf('__')!==0)ans[k]=A[k]});
 var body={action:'submit','入口':ent['キー'],'版':D['版'],'入力のしかた':MODE,'送信ID':A['__送信ID'],'答え':ans};
 if(!GAS_URL){done({ok:true,受付番号:'（試し：送っていません）'},ans);return}
 var fd=new FormData();fd.append('body',JSON.stringify(body));
 fetch(GAS_URL,{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(res){
  if(res&&res.ok){clearDraft();done(res,ans)}else{fail(res&&res.error)}}).catch(function(){fail('通信できませんでした')})}
function fail(msg){var b=document.getElementById('sendBtn');b.disabled=false;b.innerHTML='もう一度送る '+I('send');
 document.getElementById('err').textContent=(msg||'送れませんでした')+'。答えはこの端末に残っています。電波のよいところで、もう一度送ってください。'}
function draftText(ans){var t=[];ent['ページ'].forEach(function(pg){pg['問'].forEach(function(q){if(!q['口コミに使う'])return;var v=ans[q.id];if(!v||(Array.isArray(v)&&!v.length))return;
 if(Array.isArray(v))t.push(v.filter(function(x){return WIDE.indexOf(x)<0}).join('。')+'。');else{t.push(String(v));var f=ans[q.id+'（追加の答え）'];if(f)t.push(String(f))}})});
 return t.filter(function(x){return x&&x!=='。'}).join('\n')}
function done(res,ans){prog.classList.add('hide');nav.classList.add('hide');back.classList.add('hide');var kf=!!ent['下書き'],dt=kf?draftText(ans):'',B=brand(ent),REVIEW=B['口コミ'];
 var links=Object.keys(REVIEW).map(function(k){return '<a class="btn gold" '+(REVIEW[k]?'href="'+esc(REVIEW[k])+'" target=_blank':'')+' onclick="'+(kf?'cp();':'')+'">'+I('ext')+' '+k+'の口コミを書く</a>'}).join('');
 main.innerHTML='<div class="card done">'+I('check')+'<h2>ありがとうございました！</h2><p class=hint>'+esc(ent['お礼'])+'</p><p class=note>受付番号 <span class=no>'+esc(res['受付番号'])+'</span></p></div>'+
 '<div class=card><div class=lab>よかったら</div><h2>Googleの口コミも書いてもらえませんか</h2><p class=hint>書くかどうかは自由です。'+(kf?'下は、あなたが'+esc(ent['ブランド'])+'について答えた言葉を並べたものです。使うときは自由に直してください。':esc(ent['ブランド'])+'について、ひとことでも大丈夫です。')+'</p>'+
 (kf&&dt?'<div class=draft id=dt>'+esc(dt)+'</div><button class="btn sub" onclick="cp()">'+I('copy')+' 下書きをコピー</button>':'')+links+'</div>'+
 '<button class="btn sub" onclick="home()">はじめに戻る</button>'}
function cp(){var el=document.getElementById('dt');if(!el)return;try{navigator.clipboard.writeText(el.textContent).then(function(){toast('コピーしました')},function(){toast('コピーできませんでした')})}catch(e){toast('コピーできませんでした')}}
home();
</script></body></html>
